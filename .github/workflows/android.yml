name: android
on: [workflow_dispatch, push]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 9999
    steps:
      - name: android
        run: |
          export LANG=C 
          export LANGUAGE=C 
          export LC_CTYPE=C 
          export LC_NUMERIC=C 
          export LC_TIME=C 
          export LC_COLLATE=C 
          export LC_MONETARY=C 
          export LC_MESSAGES=C 
          export LC_PAPER=C 
          export LC_NAME=C 
          export LC_ADDRESS=C 
          export LC_TELEPHONE=C 
          export LC_MEASUREMENT=C 
          export LC_IDENTIFICATION=C 
          export LC_ALL=C
          sudo swapoff /swapfile
          sudo rm -rf /swapfile /usr/src /usr/lib/jvm /home/linuxbrew /home/packer /root /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/lib/google-cloud-sdk /var/lib/docker /usr/local /opt /home/runner/.*
          sudo mkdir -p /swapfile /usr/src /usr/lib/jvm /home/linuxbrew /home/packer /root /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/lib/google-cloud-sdk /var/lib/docker /usr/local /opt
          sudo apt --yes --force-yes update
          sudo apt --yes --force-yes install --no-install-suggests --no-install-recommends debootstrap qemu-user-static binfmt-support
          sudo apt --yes --force-yes clean
          sudo apt --yes --force-yes autoclean
          sudo apt --yes --force-yes autoremove
          mkdir -p android-out
          sudo debootstrap --no-merged-usr --arch=amd64 --variant=minbase --no-check-gpg --no-check-certificate lucid ubuntu-lucid http://old-releases.ubuntu.com/ubuntu
          cd ubuntu-lucid
          rm -rf etc/apt/preferences
          echo "Package: *" > etc/apt/preferences
          echo "Pin: release o=*,a=*,n=*,l=*,c=*,b=*" >> etc/apt/preferences
          echo "Pin-Priority: 1001" >> etc/apt/preferences
          rm -rf etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid-backports restricted main multiverse universe" > etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid restricted main multiverse universe" >> etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid-proposed restricted main multiverse universe" >> etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid-security restricted main multiverse universe" >> etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid-updates restricted main multiverse universe" >> etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid-backports restricted main multiverse universe" >> etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid restricted main multiverse universe" >> etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid-proposed restricted main multiverse universe" >> etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid-security restricted main multiverse universe" >> etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid-updates restricted main multiverse universe" >> etc/apt/sources.list
          sudo chroot . apt-get --yes --force-yes update --allow-unauthenticated --allow-insecure-repositories
          sudo chroot . apt-get --yes --force-yes dist-upgrade --no-install-suggests --no-install-recommends
          sudo chroot . apt-get --yes --force-yes install --no-install-suggests --no-install-recommends
          sudo chroot . apt-get --yes --force-yes clean
          sudo chroot . apt-get --yes --force-yes autoclean
          sudo chroot . apt-get --yes --force-yes autoremove

          exit 1

          git clone --depth=1 --single-branch --branch=gingerbread http://github.com/CE1CECL/android android-gingerbread
          cd android-gingerbread
          rm -rf .git
          source build/envsetup.sh
          lunch full-userdebug
          make -j droid
          cp -rfna out/target/product/generic/root out/target/product/generic/toor
          cp -rfna out/target/product/generic/system out/target/product/generic/toor/
          tar -zcvf ../android-out/android-gingerbread-full-userdebug-rootfs.tar.gz . -C out/target/product/generic/toor/
          rm -rf out
          lunch full_armv5-userdebug
          make -j droid
          cp -rfna out/target/product/generic_armv5/root out/target/product/generic_armv5/toor
          cp -rfna out/target/product/generic_armv5/system out/target/product/generic_armv5/toor/
          tar -zcvf ../android-out/android-gingerbread-full_armv5-userdebug-generic_armv5-rootfs.tar.gz . -C out/target/product/generic_armv5/toor/
          rm -rf out
          lunch full_x86-userdebug
          make -j droid
          cp -rfna out/target/product/generic_x86/root out/target/product/generic_x86/toor
          cp -rfna out/target/product/generic_x86/system out/target/product/generic_x86/toor/
          tar -zcvf ../android-out/android-gingerbread-full_x86-userdebug-generic_x86-rootfs.tar.gz . -C out/target/product/generic_x86/toor/
          rm -rf out
          cd ..
