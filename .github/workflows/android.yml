name: android
on: [workflow_dispatch, push]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 9999
    steps:
      - name: android
        run: |
          export LANG=C 
          export LANGUAGE=C 
          export LC_CTYPE=C 
          export LC_NUMERIC=C 
          export LC_TIME=C 
          export LC_COLLATE=C 
          export LC_MONETARY=C 
          export LC_MESSAGES=C 
          export LC_PAPER=C 
          export LC_NAME=C 
          export LC_ADDRESS=C 
          export LC_TELEPHONE=C 
          export LC_MEASUREMENT=C 
          export LC_IDENTIFICATION=C 
          export LC_ALL=C
          swapoff /swapfile
          rm -rf /swapfile /usr/src /usr/lib/jvm /home/linuxbrew /home/packer /root /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/lib/google-cloud-sdk /var/lib/docker /usr/local /opt /home/runner/.*
          mkdir -p /swapfile /usr/src /usr/lib/jvm /home/linuxbrew /home/packer /root /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/lib/google-cloud-sdk /var/lib/docker /usr/local /opt
          apt --yes --force-yes update
          apt --yes --force-yes install --no-install-suggests --no-install-recommends
          apt --yes --force-yes clean
          apt --yes --force-yes autoclean
          apt --yes --force-yes autoremove
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          mkdir -p android-out
          git clone --depth=1 --single-branch --branch=gingerbread http://github.com/CE1CECL/android android-gingerbread
          cd android-gingerbread
          rm -rf .git
          source build/envsetup.sh
          lunch full-userdebug
          make -j droid
          cp -rfna out/target/product/generic/root out/target/product/generic/toor
          cp -rfna out/target/product/generic/system out/target/product/generic/toor/
          tar -zcvf ../android-out/android-gingerbread-full-userdebug-rootfs.tar.gz . -C out/target/product/generic/toor/
          rm -rf out
          lunch full_armv5-userdebug
          make -j droid
          cp -rfna out/target/product/generic_armv5/root out/target/product/generic_armv5/toor
          cp -rfna out/target/product/generic_armv5/system out/target/product/generic_armv5/toor/
          tar -zcvf ../android-out/android-gingerbread-full_armv5-userdebug-generic_armv5-rootfs.tar.gz . -C out/target/product/generic_armv5/toor/
          rm -rf out
          lunch full_x86-userdebug
          make -j droid
